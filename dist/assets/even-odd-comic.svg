    <path d="M186 294V218L104 121M186 218l91-97" fill="none" stroke="#d3b27a" stroke-width="36" stroke-linecap="round"/>
    <path d="M186 294V218L104 121M186 218l91-97" fill="none" stroke="#f8eccb" stroke-width="25" stroke-linecap="round"/>
    <path d="M51 78h106v44H51z" fill="#e1ae62" stroke="#4a4937" stroke-width="4"/>
    <text x="67" y="107" font-size="21" font-weight="900" fill="#394738">SỐ CHẴN</text>
    <path d="M223 78h100v44H223z" fill="#e1ae62" stroke="#4a4937" stroke-width="4"/>
    <text x="245" y="107" font-size="21" font-weight="900" fill="#394738">SỐ LẺ</text>
