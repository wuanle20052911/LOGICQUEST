<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Truyện tranh: Bí quyết số chẵn và số lẻ</title>
  <desc id="description">Sáu khung truyện phiêu lưu của Mẫn và Mít: tìm thẻ số, ghép thành đôi, nhận ra số dư, học quy tắc chữ số cuối và phân loại số trên con đường rẽ nhánh.</desc>
