    <text class="bubbletext" x="191" y="52">Cùng tìm cách xếp nhé.</text>
    <text class="headline" x="18" y="293">HỘI LÀNG SẮP MỞ CỬA!</text>
  </g>

  <g transform="translate(412 18)">
