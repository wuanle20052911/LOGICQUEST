      <stop offset="1" stop-color="#f0e2c6"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#d8eef0"/>
      <stop offset="1" stop-color="#f5e9c9"/>
    </linearGradient>
