    <rect x="7" y="7" width="362" height="306" rx="5" fill="url(#sky)"/>
    <rect x="33" y="83" width="210" height="147" rx="8" fill="#345447" stroke="#594d3b" stroke-width="5"/>
    <text class="chalk" x="72" y="118">THỬ VỚI 13</text>
    <g fill="#f1c966" stroke="#3b4436" stroke-width="2">
      <circle cx="67" cy="157" r="12"/><circle cx="105" cy="157" r="12"/>
      <circle cx="157" cy="157" r="12"/><circle cx="195" cy="157" r="12"/>
      <circle cx="67" cy="197" r="12"/><circle cx="105" cy="197" r="12"/>
      <circle cx="157" cy="197" r="12"/>
