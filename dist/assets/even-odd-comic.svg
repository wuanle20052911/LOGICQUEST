    <text x="62" y="158" font-size="31" font-weight="900" fill="#f3d17f">0 · 2 · 4 · 6 · 8</text>
    <text class="smallchalk" x="119" y="184">LÀ SỐ CHẴN</text>
    <path d="M58 198h262" stroke="#e5dfc4" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="62" y="226" font-size="26" font-weight="900" fill="#f5b48a">1 · 3 · 5 · 7 · 9</text>
    <text class="headline" x="43" y="278">LÀ SỐ LẺ</text>
    <text class="headline" x="20" y="307">CHỈ CẦN NHỚ CHỮ SỐ TẬN CÙNG</text>
