    <circle cx="220" cy="197" r="12" fill="#ef9b6b" stroke="#3b4436" stroke-width="2"/>
    <path d="M214 216q14 15 28 0" fill="none" stroke="#fae6ac" stroke-width="3"/>
    <use href="#rabbit" transform="translate(275 155) scale(.72)"/>
    <use href="#bubble" x="186" y="12"/>
