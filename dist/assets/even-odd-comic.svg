      <ellipse cx="51" cy="34" rx="3.5" ry="5" fill="#3c352e" stroke="none"/>
      <circle cx="20" cy="44" r="4" fill="#ed947c" opacity=".8" stroke="none"/>
      <circle cx="58" cy="44" r="4" fill="#ed947c" opacity=".8" stroke="none"/>
      <path d="M34 43q5-5 10 0-2 5-5 5t-5-5m5 5q-3 5-7 2m7-2q3 5 7 2" fill="#7d5140" stroke="none"/>
      <path d="M25 67q14 10 29 0l-4 12H30z" fill="#f0cf69" stroke-width="3"/>
